# 空行追加
add_newline = true
command_timeout = 5000

# タイムアウト時間
scan_timeout = 10

[directory]
truncation_length = 2
truncate_to_repo = false

# 記号の設定
[character]
# コマンド成功時
success_symbol = "[▶](bold green)"
# コマンド失敗時
error_symbol = "[▶](bold red)"

[git_branch]
symbol = "🌱 "

[nodejs]
format = "nodejs [$version](bold green) "

# starship に pnpm モジュールがないため custom で代替する
# pnpm --version は約280ms かかるため mise 経由(約20ms)を優先する
[custom.pnpm]
command = 'v=$(mise current pnpm 2>/dev/null); [ -n "$v" ] || v=$(pnpm --version 2>/dev/null); echo "$v"'
detect_files = ["pnpm-lock.yaml"]
format = "pnpm [v$output](bold yellow) "

[php]
disabled = true

[package]
disabled = true

[docker_context]
disabled = true

[gcloud]
disabled = true
